
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack de Juegos Matemáticos 🚀</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --dark: #2C3E50;
      --light: #F7F9FC;
      --success: #2ECC71;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif, system-ui;
      background-color: var(--light);
      color: var(--dark);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }

    /* MENÚ DE JUEGOS */
    .menu {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-game {
      background-color: white;
      border: 3px solid var(--dark);
      border-radius: 15px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 var(--dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-game:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--dark);
    }

    .btn-game:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--dark);
    }

    .btn-game.active {
      background-color: var(--accent);
    }

    /* CONTENEDOR PRINCIPAL */
    .game-card {
      background: white;
      border: 4px solid var(--dark);
      border-radius: 25px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      min-height: 380px;
      box-shadow: 0 8px 0 var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
    }

    .score-board {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      background: var(--accent);
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid var(--dark);
    }

    /* ZONA DE JUEGO DINÁMICA */
    .game-title {
      font-size: 1.5rem;
      margin-top: 10px;
      color: var(--dark);
    }

    .display-area {
      font-size: 2.5rem;
      margin: 20px 0;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
    }

    .btn-option {
      background-color: var(--secondary);
      color: white;
      border: 3px solid var(--dark);
      border-radius: 15px;
      padding: 15px;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--dark);
      transition: background-color 0.2s;
    }

    .btn-option:hover {
      filter: brightness(1.05);
    }

    .btn-option:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--dark);
    }

    /* ICONOS Y FORMAS */
    .item-emoji {
      font-size: 3rem;
      animation: pop 0.3s ease;
    }

    .shape-svg {
      width: 90px;
      height: 90px;
      fill: var(--primary);
      stroke: var(--dark);
      stroke-width: 4;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* FEEDBACK ANIMACIÓN */
    .feedback {
      font-size: 2rem;
      font-weight: bold;
      height: 40px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🌟 Matemáticas Divertidas 🌟</h1>

  <!-- Menú de Selección -->
  <div class="menu">
    <button class="btn-game active" onclick="switchGame(1)">🍎 1. Contar</button>
    <button class="btn-game" onclick="switchGame(2)">➕ 2. Sumar/Restar</button>
    <button class="btn-game" onclick="switchGame(3)">📐 3. Formas</button>
  </div>

  <!-- Tarjeta del Juego -->
  <div class="game-card">
    <div class="score-board">Puntos: <span id="score">0</span> ⭐</div>
    
    <div class="game-title" id="game-title">¿Cuántas manzanas ves?</div>
    
    <div class="display-area" id="display-area">
      <!-- Elementos dinámicos aquí -->
    </div>

    <div class="options-grid" id="options-grid">
      <!-- Botones de respuesta -->
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    // Sintetizador de Voz para audio sin archivos externos
    const synth = window.speechSynthesis;
    function speak(text) {
      if (synth.speaking) synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.rate = 0.9;
      synth.speak(utter);
    }

    let currentGame = 1;
    let score = 0;
    let correctAnswer = null;

    const emojis = ['🍎', '🐶', '⭐️', '🚗', '🎈', '🐱', '🍦'];

    function switchGame(gameNum) {
      currentGame = gameNum;
      document.querySelectorAll('.btn-game').forEach((btn, index) => {
        btn.classList.toggle('active', index + 1 === gameNum);
      });
      document.getElementById('feedback').innerText = '';
      nextQuestion();
    }

    function updateScore(points) {
      score += points;
      if (score < 0) score = 0;
      document.getElementById('score').innerText = score;
    }

    function nextQuestion() {
      document.getElementById('feedback').innerText = '';
      const display = document.getElementById('display-area');
      const options = document.getElementById('options-grid');
      display.innerHTML = '';
      options.innerHTML = '';

      if (currentGame === 1) {
        setupCountGame();
      } else if (currentGame === 2) {
        setupMathGame();
      } else if (currentGame === 3) {
        setupShapeGame();
      }
    }

    /* --- JUEGO 1: CONTAR --- */
    function setupCountGame() {
      const count = Math.floor(Math.random() * 9) + 1; // 1 a 9
      correctAnswer = count;
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      document.getElementById('game-title').innerText = '¿Cuántos elementos hay?';
      speak('¿Cuántos elementos hay?');

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'item-emoji';
        span.innerText = emoji;
        display.appendChild(span);
      }

      generateNumberOptions(count, 1, 10);
    }

    /* --- JUEGO 2: SUMAS Y RESTAS BÁSICAS --- */
    function setupMathGame() {
      const isAddition = Math.random() > 0.4; // 60% sumas, 40% restas
      let num1, num2;

      if (isAddition) {
        num1 = Math.floor(Math.random() * 6) + 1;
        num2 = Math.floor(Math.random() * (10 - num1)) + 1;
        correctAnswer = num1 + num2;
        document.getElementById('game-title').innerText = `¿Cuánto es ${num1} + ${num2}?`;
        speak(`¿Cuánto es ${num1} más ${num2}?`);
      } else {
        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * num1) + 1;
        correctAnswer = num1 - num2;
        document.getElementById('game-title').innerText = `¿Cuánto es ${num1} - ${num2}?`;
        speak(`¿Cuánto es ${num1} menos ${num2}?`);
      }

      const textDisplay = document.createElement('div');
      textDisplay.style.fontSize = '3.5rem';
      textDisplay.style.fontWeight = 'bold';
      textDisplay.innerText = isAddition ? `${num1} + ${num2}` : `${num1} - ${num2}`;
      document.getElementById('display-area').appendChild(textDisplay);

      generateNumberOptions(correctAnswer, 0, 10);
    }

    /* --- JUEGO 3: FORMAS GEOMÉTRICAS --- */
    const shapes = [
      { name: 'Círculo', svg: '<circle cx="45" cy="45" r="38" />' },
      { name: 'Cuadrado', svg: '<rect x="10" y="10" width="70" height="70" />' },
      { name: 'Triángulo', svg: '<polygon points="45,10 80,80 10,80" />' },
      { name: 'Rectángulo', svg: '<rect x="5" y="20" width="80" height="50" />' }
    ];

    function setupShapeGame() {
      const selectedShape = shapes[Math.floor(Math.random() * shapes.length)];
      correctAnswer = selectedShape.name;

      document.getElementById('game-title').innerText = '¿Qué forma es esta?';
      speak('¿Qué forma es esta?');

      const svgContainer = document.createElement('svg');
      svgContainer.setAttribute('class', 'shape-svg');
      svgContainer.setAttribute('viewBox', '0 0 90 90');
      svgContainer.innerHTML = selectedShape.svg;
      document.getElementById('display-area').appendChild(svgContainer);

      // Opciones con nombres de formas
      const shuffledShapes = [...shapes].sort(() => Math.random() - 0.5);
      shuffledShapes.forEach(shape => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.style.fontSize = '1.3rem';
        btn.innerText = shape.name;
        btn.onclick = () => checkAnswer(shape.name);
        document.getElementById('options-grid').appendChild(btn);
      });
    }

    /* --- GENERADOR DE OPCIONES NUMÉRICAS --- */
    function generateNumberOptions(correct, min, max) {
      let optionsSet = new Set([correct]);
      while (optionsSet.size < 4) {
        let randomOpt = Math.floor(Math.random() * (max - min + 1)) + min;
        optionsSet.add(randomOpt);
      }

      const optionsArray = Array.from(optionsSet).sort(() => Math.random() - 0.5);

      optionsArray.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = num;
        btn.onclick = () => checkAnswer(num);
        document.getElementById('options-grid').appendChild(btn);
      });
    }

    /* --- VERIFICACIÓN DE RESPUESTA --- */
    function checkAnswer(userAnswer) {
      const feedback = document.getElementById('feedback');

      if (userAnswer === correctAnswer) {
        feedback.style.color = 'var(--success)';
        feedback.innerText = '¡Excelente! 🎉';
        speak('¡Muy bien!');
        updateScore(10);
        setTimeout(nextQuestion, 1500);
      } else {
        feedback.style.color = 'var(--primary)';
        feedback.innerText = '¡Inténtalo otra vez! ❌';
        speak('Inténtalo otra vez');
        updateScore(-2);
      }
    }

    // Iniciar el juego automáticamente
    window.onload = () => {
      nextQuestion();
    };
  </script>
</body>
</html>
